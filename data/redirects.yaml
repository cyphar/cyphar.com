# Source of truth for the static rules in the generated /_redirects file (Go
# vanity URL redirects are generated from data/govanity.yaml).

shortcuts:
  # Referenced from many talk slides in shortened QR codes.
  - from: /talks
    to: https://github.com/cyphar/talks
    code: 302
  - from: "/talk/*"
    to: "https://github.com/cyphar/talks/tree/main/:splat"
    code: 302
  # Referenced by the PDF generated by github.com/cyphar/paperback.
  - from: "/paperback"
    to: https://github.com/cyphar/paperback
    code: 302
  # Legacy compat.
  - from: /home
    to: /
    code: 301
  # The canonical .well-known host is apex cyphar.com -- the same logic as
  # apex/_redirects, one hop earlier (and what the box's nginx did before the
  # Cloudflare migration). ACME challenges go straight to the box over plain
  # http via the DNS-only dot.cyphar.com record; Let's Encrypt's HTTP-01
  # validator follows up to 10 redirects and does not validate certificates
  # on https hops. NOTE: the acme-challenge rule must stay above the
  # /.well-known/* splat (first match wins).
  - from: "/.well-known/acme-challenge/*"
    to: "http://dot.cyphar.com/.well-known/acme-challenge/:splat"
    code: 302
  # Everything else under .well-known is answered by the apex project, which
  # masks the checked-in files (with CORS headers) and bounces the rest to
  # the box.
  - from: "/.well-known/*"
    to: "https://cyphar.com/.well-known/:splat"
    code: 302
